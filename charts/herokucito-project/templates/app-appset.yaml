apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.project | quote }}
  namespace: {{ .Values.project | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: herokucito.ludat.io/production
              operator: NotIn
              values:
                - "true"
        - matchExpressions:
            - key: herokucito.ludat.io/production
              operator: In
              values:
                - "true"
          maxUpdate: 1
  generators:
    - git:
        repoURL: {{ include "herokucito-project.repoUrl" . | quote }}
        revision: herokucito
        files:
          - path: "**/rendered_values.yaml"
        values:
          slug: '{{ `{{` }} .path.path | trimPrefix "" | slugify 23 false {{ `}}` }}'
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.sources[].helm.parameters
        - .spec.source.helm.parameters
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      # TODO(ludat) I'd like to remove this prefix now since it's not useful if the app is inside it's own namespace
      name: "{{ .Values.project }}-{{ `{{` }} .values.slug {{ `}}` }}"
      labels:
        herokucito.ludat.io/production: '{{ `{{` }} dig "production" false . | toString {{ `}}` }}'
      annotations:
        kargo.akuity.io/authorized-stage: "{{ .Values.project }}:{{ `{{` }} .values.slug {{ `}}` }}"

      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.project | quote }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ .Values.project | quote }}
      syncPolicy:
        syncOptions:
          - ServerSideApply=true

  templatePatch: |
    {{ `{{-` }} $method := dig "stage" "promotion" "method" "" . | default {{ .Values.defaultPromotion.method | quote }} {{ `}}` }}
    {{ `{{-` }} if dig "production" false . {{ `}}` }}
    metadata:
      annotations:
        argocd.argoproj.io/sync-options: Delete=confirm
    {{ `{{-` }} end {{ `}}` }}
    spec:
    {{ `{{-` }} if eq $method "direct" {{ `}}` }}
    {{ `{{-` }} $platform := {{ include "herokucito-project.platformConfig" . | fromYaml | toJson | quote }} | fromYaml {{ `}}` }}
    {{ `{{-` }} $_ := set $platform "vars" (dict "slug" .values.slug) {{ `}}` }}
    {{ `{{-` }} $values := mergeOverwrite (deepCopy (omit . "path" "values")) $platform {{ `}}` }}
      source:
        repoURL: {{ .Values.appChart.repoURL | quote }}
        chart: {{ .Values.appChart.chart | quote }}
        path: {{ .Values.appChart.path | quote }}
        targetRevision: {{ .Values.appChart.version | quote }}
        helm:
          # User values with platform config merged on top (overrides user values)
          values: |{{ `{{-` }} toYaml $values | nindent 12 {{ `}}` }}
    {{ `{{-` }} else {{ `}}` }}
      sources:
        - repoURL: {{ include "herokucito-project.repoUrl" . | quote }}
          targetRevision: {{ .Values.infra.branch | quote }}
          ref: values
        - repoURL: {{ .Values.appChart.repoURL | quote }}
          chart: {{ .Values.appChart.chart | quote }}
          path: {{ .Values.appChart.path | quote }}
          targetRevision: {{ .Values.appChart.version | quote }}
          helm:
            valueFiles:
              - "$values/{{ `{{` }} .path.path {{ `}}` }}/rendered_values.yaml"
            # Platform config injected last (overrides user values)
            values: |
              vars:
                slug: {{ `{{` }} .values.slug | quote {{ `}}` }}
              {{- include "herokucito-project.platformConfig" . | nindent 14 }}
    {{ `{{-` }} end {{ `}}` }}
    {{ `{{-` }} if dig "production" false . {{ `}}` }}
      syncPolicy:
        automated:
          enabled: false
          prune: false
        syncOptions:
          - Delete=false
    {{ `{{-` }} end {{ `}}` }}
