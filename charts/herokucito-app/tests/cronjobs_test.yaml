suite: cronjobs
templates:
  - templates/cronjobs.yaml
tests:
  - it: renders cronjob referencing a service
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: v1.0.0
          port: 8080
          resources: small
      jobs:
        cleanup:
          schedule: "0 2 * * *"
          service: backend
          command:
            - ./cleanup.sh
    asserts:
      - matchSnapshot: {}

  - it: sanitizes image tag for version label
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: 1.0.0+build.5
      jobs:
        cleanup:
          schedule: "0 2 * * *"
          service: backend
          command:
            - ./cleanup.sh
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: 1.0.0-build.5
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/version"]
          value: 1.0.0-build.5
