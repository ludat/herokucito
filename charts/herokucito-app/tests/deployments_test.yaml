suite: deployments
templates:
  - templates/deployments.yaml
tests:
  - it: renders deployment for a single service
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: v1.0.0
          port: 8080
          resources: small
    asserts:
      - matchSnapshot: {}

  - it: renders deployment with custom command
    set:
      services:
        worker:
          image:
            repository: myregistry/worker
            tag: v2.0.0
          port: 9090
          resources: medium
          command:
            - ./run-worker
    asserts:
      - matchSnapshot: {}

  - it: renders deployment with pg
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: v1.0.0
          port: 8080
          resources: small
          dependencies: [somedb]
      dependencies:
        somedb:
          type: postgres
    asserts:
      - matchSnapshot: {}

  - it: renders deployment with secrets
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: v1.0.0
          port: 8080
          resources: small
          secrets:
            - my-app-secrets
            - my-api-keys
    asserts:
      - matchSnapshot: {}

  - it: sanitizes image tag for version label
    set:
      services:
        backend:
          image:
            repository: myregistry/backend
            tag: _v1.2.3+build/x@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: v1.2.3-build-x-sha256-0123456789abcdef0123456789abcdef01234567
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
          value: v1.2.3-build-x-sha256-0123456789abcdef0123456789abcdef01234567
